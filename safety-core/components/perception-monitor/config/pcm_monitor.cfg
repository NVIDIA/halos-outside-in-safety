# PCM monitor static configuration.
#
# This file is operator-authored and packaged with nv_perception_monitor.
# LEARN publishes the complete camera set atomically to pcm_baseline.cfg.
# Older per-camera learned files and packaged defaults remain readable when
# that learned bundle is absent.
#
# PCM sends AI_PIPELINE_INVALID only for real container or perception-data
# faults. A configuration or setup problem (empty container list, Docker API error,
# explicit Kafka receive/connect error, missing baseline) is printed in pcm.log
# and switches the affected check off; it never sends INVALID by itself.
# Empty Kafka polls cannot distinguish a connection outage from stopped cameras.
# Silence from previously active cameras is therefore a data fault even if Docker
# still reports Kafka healthy. Usable frames are required to recover data checks
# after an explicit source error.
# Ten consecutive received-but-undecodable messages are a data fault, not a
# connection error. Normal fault debounce applies; silence or later connection
# errors cannot clear that evidence. Decoded frames must resume before recovery.
# LEARN refuses to publish baselines if it observes this sustained corruption.

# Which ACTIVE-mode checks PCM runs. Both default to true. At least one must be
# enabled (both false refuses to start). A disabled check contributes nothing to
# the verdict, which is then driven by the enabled check(s).
#   container_health : Docker container liveness/health via the LOCAL docker socket.
#                      For a perception stack on a REMOTE host the listed containers
#                      are never seen locally, so they are only reported, not
#                      checked; disable the check there to avoid the warnings.
#   data_validation  : validate the perception data on the mdx-frames Kafka topic
#                      (reachable remotely via --kafka-broker).
[monitors]
container_health = true
data_validation = true

[fault_aggregator]
# Required positive integer counts of consecutive 1-second evaluator ticks.
# Read once at ACTIVE startup: edit the host config and restart PCM/container.
# Counts are approximate timing, not a guaranteed elapsed duration; monitor
# sampling, tick phase and reporting add latency. Choose values within the
# deployment's allowed fault-response/recovery budget. There is no code fallback.
bad_ticks_to_invalid = 4
good_ticks_to_valid = 8
# Optional, milliseconds. A missing or invalid line prints a warning and uses
# the built-in value shown here.
# A check (container health or data validation) that sends no new report for
# longer than this is "stuck": PCM prints it, ignores the check, and cannot send
# VALID until it reports again. It never sends INVALID by itself.
max_report_age_ms = 4000
# After start, the first VALID is sent once every active check has given fresh
# good results for this long. This only gates the first VALID: bad results can
# produce INVALID first, using bad_ticks_to_invalid, without waiting for VALID.
# After a PCM restart this republishes the validated state to PSS.
initial_valid_ms = 4000
# Repeat the latest judged VALID/INVALID after this interval. State changes and
# failed-send retries still run on the next evaluator tick. No judgement means
# no status to repeat. Optional milliseconds; missing/invalid uses 5000.
verdict_resend_ms = 5000

[data_validation]
# Retained for configuration compatibility (1..100). Decision-data validation
# does not use object voting: one corrupt decision-critical reference/coordinate
# can suppress a safety event, even with many unrelated healthy objects.
# Bounding boxes, confidence, speed and observed object-class ranges do not gate
# validity. Their normal scene variation is not a data fault.
bad_objects_percent = 25
# Required percentage (1..100); read once at ACTIVE startup, no fallback.
# Count bad/total frames separately for each camera in the 1-second window.
# If any camera reaches this percentage, the combined DVM window is bad.
# A camera that was sending frames and stops is bad (frame-rate check); frames
# from a camera not in the baseline are bad. Explicit Kafka errors, or a baseline
# camera that never sent a frame, are only reported; silent outages follow the
# camera frame-rate rule above.
bad_frames_percent = 25
# Optional, milliseconds (missing or invalid: warning + built-in value shown).
# Baseline cameras and listed containers that have not appeared within this time
# after start are reported in pcm.log; they are checked once they appear.
startup_grace_ms = 10000

[health_monitor]
# Docker HEALTHCHECK "starting" is unjudged for this long from its first
# observation. After expiry it is bad. It never clears an existing fault.
# Separate from startup_grace_ms, which only warns about never-seen inputs.
# Optional milliseconds; missing/invalid uses 30000.
container_startup_grace_ms = 30000
# Allow-list: each entry is the EXACT name of a container to health-check.
# PCM queries the Docker daemon directly -- it inspects each container by name over
# /var/run/docker.sock; it does NOT enumerate every container and never shells out to
# the docker CLI.
#
# A listed container that does not exist on this host is skipped (reported after
# startup_grace_ms) and checked once it appears. Once seen, a container that stops,
# turns unhealthy or disappears is a FAULT. A bad line (unknown key, empty or invalid
# name, duplicate) is skipped with a warning. With no valid entry, container health is
# NOT checked. If the Docker socket is unreachable or the Docker API returns errors,
# container health is not checked until Docker answers again (reported, never INVALID).
#
# Required continuous producers in this warehouse replay deployment:
# NvStreamer -> video/RTSP proxy -> inference -> Kafka mdx-raw -> analytics ->
# Kafka mdx-frames/mdx-events. A listed service exiting with ANY code is bad;
# paused/restarting/dead is bad even if Docker still says Running=true.
# Replace NvStreamer with the actual source service when using a different feed.
#
# Registration/configuration/control services (sensor, SDR, Redis, PostgreSQL,
# configurator), initialization jobs, dashboards, indexing and metrics are not
# directly judged here. Their effects on previously active camera data are still
# caught by DVM. PCM's own stack (safety-core/nv-psf) is not in this list.
monitor_container = vss-vios-nvstreamer
monitor_container = vss-vios-streamprocessing
monitor_container = vss-rtvi-cv
monitor_container = vss-behavior-analytics
monitor_container = kafka
