# PSS Daemon Configuration File
# Lines starting with '#' are comments and will be ignored

# Heartbeat fail-safe: consecutive RPC heartbeat misses before SW_FAIL + disconnect.
# max_hb_failures must be 1..255. WARN tier threshold = max/2 (integer division; e.g. max=7 -> warn=3).
max_hb_failures = 50

# PSS-to-PSD delivery fail-safe.
# Retry budget range: 1..10.
# The product of retry budget and response timeout must be <= 6000 ms.
pss_to_psd_retry_budget = 3

# DecisionResponse timeout range: 100..30000 ms.
pss_to_psd_response_timeout_ms = 2000

# Fixed-interval status/no-op DecisionRequest range: 100..600000 ms.
status_noop_interval_ms = 5000

# Depth of the PSS-to-PSD operational staging queue. Range: 8..512.
#
# Size this against FRAME FAN-OUT, not against event rate. Perception reports
# per frame, so events arrive as a clump sharing one timestamp and then nothing
# until the next frame; the queue has to hold one frame's worth. Measured on IGX
# against live VSS: 32.1 frames/s, mean 4.66 events per frame, peak 19. A depth
# equal to the 8-slot wire batch therefore overflowed inside a single frame's
# flush and shed 26.9% of events; 32 sheds none.
#
# Raise it if the deployment's scenes are busier, since fan-out scales with
# objects in view. The daemon reports each new high-water mark in a
# PSD_STAGING_QUEUE_HIGH_WATER line, which is the number to size against.
#
# This costs PSS heap only (~261 bytes per slot). It is NOT the wire batch:
# DecisionRequest still carries 8 events, so no schema bump, no larger socket
# buffers and no coordinated gateway/SDM redeploy are implied.
psd_operational_queue_depth = 32

# Depth of the PSS-to-PSD critical staging queue. Range: 8..512.
#
# Size it exactly as above: the critical lane takes the SAME frame fan-out.
# An event goes to this lane when the event itself is critical, or the mode is
# ERROR, or its sensor is invalid, or its AI pipeline is untrusted -- and the
# last three describe the SOURCE, so when one holds an entire frame's clump
# lands here. Leaving this at the 8-slot wire batch shed that clump at exactly
# the wrong moment, since this lane carries the SENSOR_INVALID,
# AI_PIPELINE_INVALID and SW_FAIL reports that explain the degradation.
# A full lane now makes room for such a report by evicting an event from a
# distrusted source (one every SDM skips) beyond the first 8 slots; if there is
# none, the report is refused and PSS reports ERROR until the lane is half empty.
# Depth above 8 is what gives the eviction room to work.
psd_critical_queue_depth = 32

# How long a fusion stage must fail WITHOUT INTERRUPTION before PSS declares
# ERROR. Range: 100..60000 ms.
#
# PSS instruments five processing stages. A single failure is a transient and is
# logged only; a stage that fails continuously for this long has stopped working,
# and PSS raises ERROR -- which the PSD gateway fans to every SDM as a SW_FAIL
# with cause 12 (PSS_ERROR), latching them. Recovery requires ALL five stages to
# be healthy again, and the safe-state latch still needs a validated manual
# release.
#
# A DURATION, not a count of loop iterations. The five stages run on two loops
# whose periods differ by 20x, so one iteration count would mean two different
# wall-clock durations; each loop converts this value against its own period.
#
# The default is one second of uninterrupted failure. That cannot be reached by
# a transient on a loop iterating every 0.1-2 ms, and it still escalates well
# inside status_noop_interval_ms (5000) and the SDM's 7000 ms freshness timeout,
# so PSS names the cause before an SDM infers one from silence. Lower it only
# with evidence from a soak run; raising it delays the fault report.
fusion_failure_error_ms = 1000

# How many CONSECUTIVE rejected reports from one required source raise a
# source-attributed SW_FAIL (cause 13, CLIENT_INPUT_UNUSABLE). Range: 3..10000.
#
# A report is rejected for a bad CRC or schema, a clientID that does not match
# the connection, confidence below threshold, an unresolved sensor, or an
# unauthorized client type. Any ONE of those is ordinary; a client that produces
# nothing else has an input that is live but unusable, which fresh transport
# liveness would otherwise hide. An accepted report resets the count, so an
# intermittently noisy client never accumulates.
#
# Only sources the SDMs latch on escalate. In 2D that is the cameras in
# sensor_config; in 3D it is the BEV group alone, because a member camera's
# degradation is resolved into the group verdict before an SDM sees it. A client
# that has never had a report accepted has no established identity and cannot
# escalate at all -- that is what stops a rogue peer latching every SDM just by
# sending garbage. Non-escalating streaks are still counted and logged.
#
# At roughly 30 Hz per-frame reporting the default is under two seconds of
# continuous garbage, which is well above any plausible burst of bad frames.
client_reject_error_threshold = 50

# ---------------------------------------------------------------------------
# REQUIRED SAFETY SOURCES. All three are MANDATORY
# and strictly parsed: the daemon refuses to start if one is missing, repeated,
# or not a plain number in range. They are never defaulted.
#
# This declares the safety sources PSS requires. For control-plane launches,
# launch_psf.sh checks these keys against the independent --saim-mode and
# --pcm-mode selections: 1 for active, 0 for learn or skip. A mismatch is
# rejected before startup; the launcher never rewrites this policy.
#
# What "required" means to PSS. Every registered monitor, and every numbered MDX
# instance, is tracked whether or not it is required: if it hangs, crashes,
# unregisters or is dropped, every SDM latches and no release is accepted until
# THAT source is back. A required source is additionally held to coming up: one
# that has not registered once the heartbeat budget has run out since the daemon
# started (max_hb_failures ticks of 5 s -- about 4 min at 50) is reported lost,
# reason never_registered, and from then on every SDM expects it -- including an
# SDM that restarts later.
#
# Safety AI Monitor (sensor-input health). 1 = required and launched.
required_safety_monitor = 1
#
# Perception Monitor (AI-pipeline trust). 1 = required and launched.
required_perception_monitor = 1
#
# MDX client instances 1..N (0..8). mdx_client is started with --instance-id <k>;
# the launchers run exactly one, as instance 1. Set 0 only for a deployment with no
# mdx_client at all.
required_mdx_instances = 1

# Deployment topology. MANDATORY -- the daemon refuses to start without it.
#
#   2D  each camera reports its own events; sensor identities are the cameras.
#   3D  cameras are calibrated into a BEV group and events are reported under
#       the group. Requires sensorGroupConfig, and requires enableFusion = false
#       because BEV fuses perception before PSS receives it.
#
# Declared, not inferred from which files are present: the topology a deployment
# runs must be readable from this file alone.
deploymentMode = 2D

# BEV group membership. Read ONLY when deploymentMode = 3D, where it is required
# and a read failure is fatal. Present-but-unread in 2D is named in the startup
# log so it cannot be mistaken for active.
# sensorGroupConfig = /opt/nvidia/psf/bin/sensor_group_config.conf

# Enable multi-camera event fusion. MANDATORY -- true or false, case-insensitive.
# The daemon refuses to start if this key is missing, unreadable, repeated, or
# set to anything else. It will not pick an event pipeline the configuration
# does not state.
#
#   true   Detections of the same object seen by several cameras are correlated
#          into ONE event before the safety decision maker sees them.
#   false  Each camera's report is delivered separately. No correlation.
#
#
# Changing this key requires a daemon restart. It is read once at startup.
enableFusion = true

# Time window for correlation (in milliseconds).
# REQUIRED IN BOTH MODES. This is not only a fusion parameter: it also sets the
# age past which an event is marked STALE, and the SDMs drop STALE events. With
# enableFusion=false it is still the staleness threshold.
#
timeWindowSize = 400

# --- The keys below are FUSION-ONLY. -----------------------------------------
# With enableFusion=false they are neither required nor evaluated: they may be
# absent, empty, or hold any value, and the daemon logs once at startup naming
# the ones it ignored. With enableFusion=true they are required.
# -----------------------------------------------------------------------------

# Minimum similarity threshold for fusion (0.0 to 1.0)
fusionThreshold = 0.4

# Weightage of Temporal Similarity for fusion (0.0 to 1.0)
alpha = 0.4

# Weightage of Spatial Similarity for fusion (0.0 to 1.0)
beta = 0.4

# Weightage of Attribute Similarity for fusion (0.0 to 1.0)
gamma = 0.2

# Time window for temporal tolerance (in milliseconds)
temporalTolerance = 10

#Number of trajectory points for spatial corelation
#Even number between 0 - 10
trajectoryCount = 4

# --- End of the fusion-only keys. --------------------------------------------

# Maximum number of pipelines supported.
# REQUIRED IN BOTH MODES: it bounds which pipeline IDs are accepted at all, and
# that check runs whether or not events are fused.
maxPipelines=3

# List of safety event types that bypass fusion and are sent directly for decision.
# Accepted names: EVENT_0..EVENT_23, SW_FAIL, SENSOR_INVALID, SENSOR_VALID,
# AI_PIPELINE_INVALID, AI_PIPELINE_VALID. Anything else is logged and skipped.
# The four trust-report types are always bypassed regardless of this list.
bypassFusionEvents = SW_FAIL

# Path to the unified sensor configuration file (REQUIRED).
# Format: pipelineId, sensorName, rtspUrl (one sensor per line).
# The daemon validates incoming SafetyEvent pipelineID + sensorIdentifier
# against this config. The daemon will fail to start if this path is missing
# or the file cannot be parsed.
sensorConfig = /opt/nvidia/psf/bin/sensor_config.conf
