# PSS Daemon Configuration File
# Lines starting with '#' are comments and will be ignored

# Heartbeat fail-safe: consecutive RPC heartbeat misses before SW_FAIL + disconnect.
# max_hb_failures must be 1..255. WARN tier threshold = max/2 (integer division; e.g. max=7 -> warn=3).
max_hb_failures = 50

# PSS-to-PSD delivery fail-safe.
# Retry budget range: 1..10.
# The product of retry budget and response timeout must be <= 6000 ms.
pss_to_psd_retry_budget = 3

# DecisionResponse timeout range: 100..30000 ms.
pss_to_psd_response_timeout_ms = 2000

# Fixed-interval status/no-op DecisionRequest range: 100..600000 ms.
status_noop_interval_ms = 5000

# Time window for correlation (in milliseconds)
timeWindowSize = 1000

# Minimum similarity threshold for fusion (0.0 to 1.0)
fusionThreshold = 0.4

# Weightage of Temporal Similarity for fusion (0.0 to 1.0)
alpha = 0.4

# Weightage of Spatial Similarity for fusion (0.0 to 1.0)
beta = 0.4

# Weightage of Attribute Similarity for fusion (0.0 to 1.0)
gamma = 0.2

# Time window for temporal tolerance (in milliseconds)
temporalTolerance = 10

#Number of trajectory points for spatial corelation
#Even number between 0 - 10
trajectoryCount = 4

#Maximum number of pipelines supported
maxPipelines=3

# List of safety event types that bypass fusion and are sent directly for decision
bypassFusionEvents = SW_FAIL

# Select PSS Daemon to PSD communication channel between POSIX_SOCKET & POSIX_MSG_QUE
PSSDToPSDComBackend = POSIX_MSG_QUE

# Path to the unified sensor configuration file (REQUIRED).
# Format: pipelineId, sensorName, rtspUrl (one sensor per line).
# The daemon validates incoming SafetyEvent pipelineID + sensorIdentifier
# against this config. The daemon will fail to start if this path is missing
# or the file cannot be parsed.
sensorConfig = /opt/nvidia/psf/bin/sensor_config.conf
