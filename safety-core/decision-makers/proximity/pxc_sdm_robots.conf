#
# PXC instance two: Transporter, Agility_Digit_Humanoid and
# Fourier_GR1_T2_Humanoid, each paired with Person. No machine-to-machine pair.
# humanoid_person keeps its existing meaning: Agility_Digit_Humanoid/Person.
# Copy/edit bin/pxc_sdm_robots.conf.sample and select it with --sdm-config.
# Use with proximity_event_mapping.pb.txt. VSS must enable all three
# robot classes as proximity centers and Person as the surrounding class.

pair_groups = transporter_person,humanoid_person,fourier_humanoid_person
transporter_person_normal = EVENT_18
transporter_person_reduce = EVENT_19
transporter_person_stop   = EVENT_20
humanoid_person_normal    = EVENT_15
humanoid_person_reduce    = EVENT_16
humanoid_person_stop      = EVENT_17
fourier_humanoid_person_normal = EVENT_21
fourier_humanoid_person_reduce = EVENT_22
fourier_humanoid_person_stop   = EVENT_23
