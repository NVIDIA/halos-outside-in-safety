#
# Single PXC, ATL+PXC, or PXC instance one: Forklift <-> Person only.
# Copy/edit bin/pxc_sdm_forklift.conf.sample and select it with --sdm-config.
# All three tiers of each selected group are required; omit unselected keys.
# Use with proximity_event_mapping.pb.txt. EVENT_0..11 are reserved for ATL.
# To expand a SINGLE PXC, add the desired pair_groups entries and all three
# bindings for each group from pxc_sdm_robots.conf, then restart the SDM.
# Do not also launch a second PXC subscribed to those same groups/event codes.

pair_groups = forklift_person
forklift_person_normal = EVENT_12
forklift_person_reduce = EVENT_13
forklift_person_stop   = EVENT_14
