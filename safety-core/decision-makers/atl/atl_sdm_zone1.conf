#
# ATL SDM startup configuration:
#
#   atl_sdm --config .../atl_sdm_zone1.conf --cmd_rx_port 12345 \
#           --log_file atl_sdm_zone1.log
#
# This is the reference copy of the format and the file to start from. Its
# values are the historic single-deployment binding, so a single-zone
# deployment uses it as-is -- and every in-tree launch path passes it.
#
# --config is MANDATORY: atl_sdm has no compiled-in binding and refuses to
# start without one. That is deliberate. A defaulted binding would let a second
# zone's SDM, started without a config, register for the FIRST zone's event
# codes, track the first zone's trailer and emit a mute permission on its own
# PLC port for a trailer it has no evidence about.
#
# It covers zone 1 -- tripwire-id-1 and roi-id-1 in event_mapping_atl.pb.txt.
# For a second trailer bay served by a second atl_sdm on the same host, see
# atl_sdm_zone2.conf next to it and the zone 2 block of that mapping file.
#
# Lines starting with '#' are comments; a '#' after a value is also ignored.
# Every key below is MANDATORY. A file that states only part of the binding is
# refused: there is nothing to fall back to for the rest, and a partially
# applied safety binding is worse than none.

# --- Which event code carries each ATL situation -----------------------------
#
# A generic EVENT_n means whatever the mdx-client event map assigns to it, so
# these six must match the output_event values in the mapping file this
# deployment runs (apps/atl/event_mapping_atl.pb.txt by default).
#
# Accepted names: EVENT_0 .. EVENT_23. The six must be distinct. They need not
# be contiguous or ordered. SW_FAIL is rejected: it is always subscribed and
# handled as a fault, so it cannot carry a situation.
#
# Two ATL SDMs on one PSD gateway must not share a code. The gateway routes by
# registration, so a shared code is delivered to both and one zone's events
# would move the other zone's trailer occupancy.

forklift_entered = EVENT_0   # forklift tripwire OUT -- entered the trailer
forklift_exited  = EVENT_1   # forklift tripwire IN  -- left the trailer
person_entered   = EVENT_2   # person tripwire OUT   -- entered the trailer
person_exited    = EVENT_3   # person tripwire IN    -- left the trailer
roi_violation    = EVENT_4   # a person is in the restricted area
roi_cleared      = EVENT_5   # that violation cleared

# The safety-relevant cameras are NOT set here. They come from
# sensor_pipelines_config.conf (--sensor_pipelines_config), which every
# SDM and mdx-client read, so one reviewed set serves the whole deployment.
# A 'safety_pipelines' line left over from an earlier release is rejected by
# name at startup rather than ignored.
