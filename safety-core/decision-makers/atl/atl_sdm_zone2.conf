#
# Zone 2 of a two-zone ATL deployment (ATL + ATL). The matching rules are the
# zone 2 block of event_mapping_atl.pb.txt; see README.md. atl_sdm_zone1.conf
# next to it is the other zone and carries the fully commented reference copy
# of this format.
#
#   atl_sdm --config .../atl_sdm_zone2.conf --cmd_rx_port 12346 \
#           --log_file atl_sdm_zone2.log
#
# Zone 2 covers tripwire-id-2 and roi-id-2. Its codes are disjoint from zone
# 1's: the PSD gateway routes by registration, so a code both SDMs registered
# for would be delivered to both, and one zone's person entering would raise
# the other zone's trailer occupancy count.

forklift_entered = EVENT_6
forklift_exited  = EVENT_7
person_entered   = EVENT_8
person_exited    = EVENT_9
roi_violation    = EVENT_10
roi_cleared      = EVENT_11

# The safety-relevant cameras are NOT set here. They come from
# sensor_pipelines_config.conf (--sensor_pipelines_config), which every
# SDM and mdx-client read, so one reviewed set serves the whole deployment.
# A 'safety_pipelines' line left over from an earlier release is rejected by
# name at startup rather than ignored.
