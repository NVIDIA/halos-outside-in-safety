# Analyzer tuning configuration
# Luma scoring weights (should sum to 1.0)
w_histogram=0.25
w_contrast=0.20
w_edge=0.20
w_entropy=0.20
w_laplacian=0.15

# Chroma (UV) weights for cb, cr and saturation
uv_weight_cb=0.4
uv_weight_cr=0.4
uv_weight_sat=0.2

# k*sigma statistical thresholding parameters
k=4.0
sigma_floor_fraction=0.05

# Canny edge detection thresholds
canny_low_thresh=50
canny_high_thresh=150

# Alert transition: saturating counter with dual-threshold
score_low_threshold=45
score_high_threshold=55
counter_max=15
max_increment=3
max_decrement=2
