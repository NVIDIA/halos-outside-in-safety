# Sensor pipelines configuration file
# Fields: pipelineId, sensorName
#
# The identities that appear on decision-driving events. Read by mdx-client
# (Kafka sensor id -> pipelineID) and by the SDMs (the reviewed sensor
# set behind the all-safety-relevant-sensors-failed latch).
#
# NOT the same list as sensor_config.conf, even though both carry pipelineIds:
#
#   sensor_config.conf            the RTSP streams SAIM opens and watches.
#   sensor_pipelines_config.conf  the identities events arrive under.
#
# In 2D deployments the two list the same cameras, because in 2D the cameras
# ARE the event sources. This file is the 2D form.
#
# In 3D they diverge. SAIM still watches every camera, but Kafka reports under
# the BEV group, so this file names ONLY the group -- for example:
#
#   4, bev-sensor-1
#
# and the cameras do not appear here at all. A 3D deployment that copies the
# rows below has the reviewed set backwards: no event would ever match it and
# the all-safety-relevant-sensors-failed latch could never arm.
#
# No rtspUrl column, deliberately: a BEV group has no stream. That is why this
# is a separate file rather than an extra column on sensor_config.conf.

# THIS LIST IS THE LATCH CONDITION. Match it to the cameras the deployment
# actually runs, not to the ones it could run.
#
# The all-safety-relevant-sensors-failed latch fires when EVERY id below has
# failed. An id listed here that no camera ever reports can never fail, so the
# condition can never be met and the latch is silently disabled. Listing fewer
# cameras than are deployed is the opposite error: the latch fires while a
# working camera is still delivering frames.
#
# The rows below match pkg/sensor_config.conf, which is the 3-camera reference
# deployment. A 2-camera site edits THIS FILE -- it does not edit an SDM source
# table, which is how the ATL and PXC reviewed sets came to disagree before this
# was configuration.
#
# Each SDM logs the set it resolved at startup. Read that line against the
# cameras you actually have.

1, Camera
2, Camera_01
3, Camera_02
