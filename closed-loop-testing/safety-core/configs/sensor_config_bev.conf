# pipelineId, sensorName, rtspUrl
#
# 3D (Sparse4D) profile. The BEV analytics app fuses every camera into one
# logical sensor, so mdx-frames carries sensorId=bev-sensor-1 and never a
# per-camera name; sensorName must equal it or PSF ignores every frame.
# The RTSP URL is read by SAIM only (PSF_LAUNCH_MODE=learn|active).
1, bev-sensor-1, rtsp://localhost:8554/camera
