# PSS Daemon Configuration File — 3D (Sparse4D) feed.
# Use instead of nvpss.conf: PSF_NVPSS_CONFIG_SRC=./configs/nvpss_bev.conf, together with
# PSF_SENSOR_PIPELINES_CONFIG_SRC=./configs/sensor_pipelines_config_bev.conf.
# Keep the delivery keys below in step with nvpss.conf.
# Lines starting with '#' are comments and will be ignored

# Heartbeat fail-safe: consecutive RPC heartbeat misses before SW_FAIL + disconnect.
# Range [1, 255]. Image default 50.
max_hb_failures = 50

# PSS-to-PSD delivery fail-safe: retries x response timeout must stay <= 6000 ms.
pss_to_psd_retry_budget = 3
pss_to_psd_response_timeout_ms = 2000

# Interval of the status/no-op DecisionRequest (100..600000 ms).
status_noop_interval_ms = 5000

# PSS-to-PSD staging queues (8..512). Size them against one frame's events, not
# the event rate; the daemon logs PSD_STAGING_QUEUE_HIGH_WATER to size against.
psd_operational_queue_depth = 32
psd_critical_queue_depth = 32

# Deployment topology, mandatory. 3D: the BEV app fuses the cameras before PSS, so
# events arrive under the group bev-sensor-1 (pipeline 4), while sensor_config.conf
# lists the cameras themselves (pipelines 1-3) — the streams SAIM watches. The
# daemon derives the group's health from its members' and the SDM sees only the
# group. 3D refuses to start unless sensorGroupConfig parses to exactly one group
# whose id is no camera id and <= maxPipelines, every member is in sensor_config.conf,
# and enableFusion = false.
deploymentMode = 3D
sensorGroupConfig = /opt/nvidia/psf/bin/sensor_group_config.conf

# The BEV app has already fused the cameras; PSS has nothing left to correlate.
# The fusion-only keys (fusionThreshold, alpha, beta, gamma, temporalTolerance,
# trajectoryCount) are not read with fusion off and are left out.
enableFusion = false

# Required in both modes: with fusion off it is the age past which an event is
# STALE, and the SDMs drop STALE events. SIL keeps 6 s, as in nvpss.conf, to cover
# the perception transport skew.
timeWindowSize = 6000

# Bounds the accepted pipeline ids, so it must reach the group id (4).
maxPipelines=4

# Proximity event map (PSF_APP=pxc) — configs/proximity_event_mapping.pb.txt,
# bound to the SDM by configs/pxc_sdm.conf:
#   EVENT_12 no violation -> CMD_NORMAL   EVENT_13 REDUCE tier -> CMD_REDUCE
#   EVENT_14 STOP tier    -> CMD_STOP
# With fusion off every event goes straight to the SDM, so there is no
# bypassFusionEvents list: the daemon counts it as a fusion-only key and ignores it.

sensorConfig = /opt/nvidia/psf/bin/sensor_config.conf
