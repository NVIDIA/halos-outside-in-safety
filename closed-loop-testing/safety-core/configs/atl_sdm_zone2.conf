#
# ATL zone 2 binding (atl-dual-override.yaml), passed with --sdm-config after
# atl_sdm.conf. The six codes must match the zone 2 block of the image's
# event_mapping_atl.pb.txt (tripwire-id-2, roi-id-2) and differ from zone 1's:
# the gateway routes by registration, so a shared code would reach both SDMs.

forklift_entered = EVENT_6   # forklift tripwire OUT: entered the trailer
forklift_exited  = EVENT_7   # forklift tripwire IN: left the trailer
person_entered   = EVENT_8   # person tripwire OUT: entered the trailer
person_exited    = EVENT_9   # person tripwire IN: left the trailer
roi_violation    = EVENT_10  # a person is in the restricted area
roi_cleared      = EVENT_11  # that violation cleared
