# pipelineId, sensorName, rtspUrl
# IGX Thor base profile. The AI monitor reads the VST live URLs on this Thor host.
# Replace <thor_ip> and each <UUID> with values from:
#   curl http://<thor_ip>:30888/vst/api/v1/sensor/list
# The UUIDs change whenever VST state is wiped/redeployed — refresh this file after a VST reset.
# Row order matters: pipelineId 1/2/3 must align with VST stream ports 30554/30555/30556.
1, Camera,    rtsp://<thor_ip>:30554/live/<UUID-Camera>
2, Camera_01, rtsp://<thor_ip>:30555/live/<UUID-Camera_01>
3, Camera_02, rtsp://<thor_ip>:30556/live/<UUID-Camera_02>
