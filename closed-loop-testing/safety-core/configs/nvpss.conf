# PSS Daemon Configuration File
# Lines starting with '#' are comments and will be ignored

# Heartbeat fail-safe: consecutive RPC heartbeat misses before SW_FAIL + disconnect.
# Range [1, 255]. Image default 50.
max_hb_failures = 50

# PSS-to-PSD delivery fail-safe: retries x response timeout must stay <= 6000 ms.
pss_to_psd_retry_budget = 3
pss_to_psd_response_timeout_ms = 2000

# Interval of the status/no-op DecisionRequest (100..600000 ms).
status_noop_interval_ms = 5000

# PSS-to-PSD staging queues (8..512). Size them against one frame's events, not
# the event rate; the daemon logs PSD_STAGING_QUEUE_HIGH_WATER to size against.
psd_operational_queue_depth = 32
psd_critical_queue_depth = 32

# Deployment topology, mandatory. 2D: the event sources are the cameras named in
# sensor_config.conf and sensor_pipelines_config.conf. The 3D (Sparse4D) feed
# uses configs/nvpss_bev.conf instead (deploymentMode = 3D, BEV group).
deploymentMode = 2D

# Multi-camera event fusion, mandatory (true | false).
enableFusion = true

# Time window for correlation (in milliseconds)
# Also controls STALE event threshold - events older than this are dropped
# Default: 200ms. SIL sets 6000ms (6 s) to cover perception / EventsParser transport
# skew so PSF does not drop tripwire events as STALE.
timeWindowSize = 6000

# Minimum similarity threshold for fusion (0.0 to 1.0)
fusionThreshold = 0.4

# Weightage of Temporal Similarity for fusion (0.0 to 1.0)
alpha = 0.4

# Weightage of Spatial Similarity for fusion (0.0 to 1.0)
beta = 0.4

# Weightage of Attribute Similarity for fusion (0.0 to 1.0)
gamma = 0.2

# Time window for temporal tolerance (in milliseconds)
temporalTolerance = 50

#Number of trajectory points for spatial corelation
#Even number between 0 - 10
trajectoryCount = 4

#Maximum number of pipelines supported
maxPipelines=3

# List of safety event types that bypass fusion and are sent directly for decision.
#
# ATL event map — source of truth: safety-core/adapters/vss/event-mappings/atl/event_mapping_atl.pb.txt
# (packaged into the PSF image at /opt/nvidia/psf/apps/atl/event_mapping_atl.pb.txt; all severity HIGH).
# Tripwire = trailer entry line: OUT = crossed INTO the trailer, IN = crossed OUT of the trailer.
#   EVENT_0  Forklift tripwire OUT  (mdx-events, tripwire-id-1) -> forkliftInTrailer=true  -> MUTE if no person
#   EVENT_1  Forklift tripwire IN   (mdx-events, tripwire-id-1) -> forkliftInTrailer=false -> UNMUTE
#   EVENT_2  Person   tripwire OUT  (mdx-events, tripwire-id-1) -> personsInTrailerCount++ -> UNMUTE
#   EVENT_3  Person   tripwire IN   (mdx-events, tripwire-id-1) -> personsInTrailerCount--
#   EVENT_4  Person restricted-area ROI violation  (mdx-frames, roi-id-1) -> UNMUTE
#   EVENT_5  Person ROI violation CLEARED          (mdx-frames, roi-id-1) -> clear flag
#   EVENT_6..EVENT_11 are the same six for the second trailer bay (tripwire-id-2 / roi-id-2),
#   read only by the zone-2 SDM of --app atl_dual (atl-dual-override.yaml).
#   (EVENT_0..EVENT_11 are reserved for ATL; proximity uses EVENT_12 and up.)
# rule_id values (tripwire-id-N / roi-id-N) must match the ids in the VSS calibration.json.
#
# Proximity (PSF_APP=pxc, EVENT_12/13/14) runs on the 3D feed only, under
# nvpss_bev.conf: on a 2D feed each camera's EVENT_12/13/14 would reach the SDM's
# last-writer-wins batch on its own, so one camera's NORMAL could override
# another's STOP.
#
# Accepted names: EVENT_0..EVENT_23, SW_FAIL, SENSOR_INVALID/VALID,
# AI_PIPELINE_INVALID/VALID; anything else is logged and skipped. Keep SW_FAIL
# in the list always.
bypassFusionEvents = SW_FAIL, EVENT_0, EVENT_1, EVENT_2, EVENT_3, EVENT_4, EVENT_5, EVENT_6, EVENT_7, EVENT_8, EVENT_9, EVENT_10, EVENT_11

sensorConfig = /opt/nvidia/psf/bin/sensor_config.conf

