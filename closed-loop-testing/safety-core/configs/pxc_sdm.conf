# Proximity SDM binding (PSF_APP=pxc), passed with --sdm-config. Each selected
# pair group needs all three tiers, and the codes must match output_event in
# configs/proximity_event_mapping.pb.txt. EVENT_0..EVENT_11 are reserved for ATL.

pair_groups = forklift_person
forklift_person_normal = EVENT_12
forklift_person_reduce = EVENT_13
forklift_person_stop   = EVENT_14
