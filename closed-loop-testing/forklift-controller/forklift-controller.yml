# Everything every forklift controller shares. A truck differs only in its
# ROBOT_ID — speed, heading and route all come from its block in the robots
# config. One container drives one truck, so which truck it is has to be said
# here; everything else about it is said once, in the fleet file.
x-forklift-env: &forklift-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}  # SUBNET=LAN multicast (multi-host/HIL) | LOCALHOST=single-host SIL (set in sil.env) | OFF
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  # Isaac reads the same SCENARIO, so the two cannot run different halves of one
  # run. It names the fleet file and the map; the two below override it per run.
  SCENARIO: ${SCENARIO:-}
  # A file name under configs/, e.g. robots-2fl.yaml (an absolute path also
  # works); WAYPOINTS_MAP is a directory name under waypoints/. Each overrides
  # one key of the scenario for a one-off run, not the run itself.
  ROBOTS_CONFIG: ${ROBOTS_CONFIG:-}
  WAYPOINTS_MAP: ${WAYPOINTS_MAP:-}
  # Passed through only so entrypoint.sh can refuse it. A profile carrying the
  # old variable is the case the refusal exists for, and a guard compose never
  # hands the variable to is a guard that cannot fire.
  FORKLIFT_WAYPOINTS_DIR: ${FORKLIFT_WAYPOINTS_DIR:-}

x-forklift-volumes: &forklift-volumes
  # The robots config and the loader that reads it. Shared rather than copied:
  # two implementations of the `models:` merge would be two things to keep agreeing.
  - ${ISAAC_SIL_DIR:-../isaac-sim/sil}/configs:/app/robots:ro
  - ${ISAAC_SIL_DIR:-../isaac-sim/sil}/scripts:/app/isaac:ro
  # The whole tree, not one warehouse: the map is chosen inside the container.
  - ./waypoints:/app/waypoints:ro
  # The controller source itself is NOT mounted: it comes from the image, so
  # `docker run forklift-controller:latest` behaves like the compose stack and a
  # module missing from the Dockerfile fails here instead of hiding behind the
  # host tree. Source edits need `up -d --build`.

services:
  forklift-controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: forklift-controller:latest
    container_name: forklift-controller
    profiles: ["sil", "hil"]
    network_mode: host
    environment:
      <<: *forklift-env
      ROBOT_ID: forklift_b   # contract: ROBOT_ID == robots config block name == prim leaf
    volumes: *forklift-volumes
    restart: unless-stopped

  # Second forklift controller. Enable via COMPOSE_PROFILES=sil,multi-robot.
  forklift-controller-b2:
    image: forklift-controller:latest
    pull_policy: never   # image is built by the primary service; never try a registry pull
    container_name: forklift-controller-b2
    profiles: ["multi-robot"]
    network_mode: host
    environment:
      <<: *forklift-env
      ROBOT_ID: forklift_b2
    volumes: *forklift-volumes
    restart: unless-stopped
