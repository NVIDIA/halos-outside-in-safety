# Halos SIL forklift / robot Action Graph config (6.0) — TWO-FORKLIFT variant.
#
# Opt-in multi-robot config (forklift_b + forklift_b2). The default is the
# single-robot configs/robots.yaml. To run this variant:
#   1. Scene must contain /World/forklift_b2 (a clone of /World/forklift_b —
#      same ForkliftB asset payload). The repo ships one plus a matching IRA
#      config: configs/default_config_ros_2fl.yaml points at
#        /isaac-sim/sil/scenes/indicator_warehouse_20x20_layout_overflow_test_2fl.usd
#      run_actor_sdg fails fast if a listed articulation prim is missing.
#   2. Launch Isaac with the 2FL config pair (both flags together):
#        -c /isaac-sim/sil/configs/default_config_ros_2fl.yaml \
#        --robots-config /isaac-sim/sil/configs/robots-2fl.yaml
#   3. COMPOSE_PROFILES must include `multi-robot` so the second controller
#      container (forklift-controller-b2) starts.
# The shipped 2FL scene intentionally differs from the stock scene beyond the
# forklift_b2 clone (multi-forklift test scenario): 4 Loading_Zone_Objects
# prims deactivated, 2 RectLights repositioned toward the second corridor,
# and 8 decorative camera meshes hidden — expect a different perception
# baseline than the single-forklift scene.
# One block per robot. Add a robot = add a block here + a controller service
# (forklift-controller.yml) + the prim in the scene; also list the prim in
# runtime_patches/halos_runtime_patches.py _HALOS_FORKLIFT_ARTICULATIONS
# (TGS rebalance).
# Keep the `models:` block and the forklift_b block in sync by hand with
# configs/robots.yaml: the model is declared per file so each stays launchable
# on its own. Sync check: both must be byte-identical in the two files.

# What follows from the asset, stated once. Both trucks here are the same
# ForkliftB payload and so cannot disagree about their wheelbase — before this
# block those seven values were copied per robot, and copies that must stay
# identical hide the day one of them stops being.
models:
  forklift_b:
    # Which control graph gets built — a choice of topology, not a label. The
    # swivel builder drives one steered wheel and one driven wheel; a
    # differential-drive robot needs its own builder rather than these numbers
    # rewritten. An unknown value is refused at load.
    drive_type: swivel
    drive_joint: back_wheel_drive     # velocity-controlled wheel joint
    swivel_joint: back_wheel_swivel   # position-controlled steer joint
    wheelbase: 1.49                   # constant_double_wheelbase
    wheel_radius: 0.15                # constant_double_WheelRadius
    max_steer_deg: 45.0               # SwivelIK MAX_STEER = radians(45)
    # Frame-convention sign flips (vehicle frame vs ROS frame). The original
    # baked SwivelIK negated both inputs, so both are true here. Set false
    # if the robot asset already matches the ROS twist convention.
    reverse_logic:
      flip_linear_x: true             # negate cmd_vel linear.x
      flip_angular_z: true            # negate cmd_vel angular.z

    robot_front: [-1.0, 0.0, 0.0]     # ros2_publish_odometry.inputs:robotFront

    # Where the disc hangs, so `indicator_prim` need not be retyped per truck.
    # No size next to it, unlike robots-40x20.yaml: this scene's discs come with
    # the prim clones, and stating a size makes indicator_loader.py author a
    # second one at the same path, which is an error rather than a duplicate.
    #
    # No asset_path either — both trucks are baked into this scene, so nothing
    # spawns them.
    indicator:
      parent_prim_rel: body/body

robots:
  - name: forklift_b
    model: forklift_b
    # Articulation root prim (was articulation_controller.inputs:targetPrim
    # and isaac_compute_odometry_node.inputs:chassisPrim = /World/forklift_b).
    articulation_prim: /World/forklift_b

    # --- control (ROS_Forklift_Control_Graph) ---
    # Joints and geometry come from the model; what is left is this truck's own.
    control:
      enabled: true
      cmd_vel_topic: forklift_b/cmd_vel # per-robot namespace (controller USE_NAMESPACE=true; FORKLIFT_* vars in sil.env/hil.env)

    # --- odometry (Odometry_Graph) ---
    odometry:
      enabled: true
      odom_topic: forklift_b/odom     # per-robot namespace
      tf_topic: tf                    # ROS2PublishRawTransformTree.topicName (USD: default)
      # TF frame ids default to <name>/odom -> <name>/base_link, so two trucks do
      # not publish the same edge onto one /tf. Override with odom_frame_id /
      # base_frame_id to get the bare ROS names back.

    # --- safety indicator (Safety_indicator_Graph) ---
    safety_indicator:
      enabled: true
      # Explicit on purpose: the default is now the per-robot
      # /<name>/safety/is_muted, which only exists where comm-layer is told to
      # mirror it (COMM_ROBOT_IDS). This scene stays on the global topic.
      muted_topic: /safety/is_muted   # std_msgs/Bool subscriber
      # indicator_prim comes from the model: /World/forklift_b/body/body/safety_indicator

  # Second forklift: same model, and its scene-side prim is a clone of
  # /World/forklift_b, so it differs only in where its traffic goes.
  # Contract: name == controller ROBOT_ID == prim leaf name.
  - name: forklift_b2
    model: forklift_b
    articulation_prim: /World/forklift_b2

    control:
      enabled: true
      cmd_vel_topic: forklift_b2/cmd_vel

    odometry:
      enabled: true
      odom_topic: forklift_b2/odom
      tf_topic: tf                    # frame ids default to forklift_b2/odom -> .../base_link

    safety_indicator:
      enabled: true                   # indicator mesh comes along with the prim clone
      muted_topic: /safety/is_muted   # shared global mute (per-forklift mute deferred)
      # indicator_prim comes from the model: /World/forklift_b2/body/body/safety_indicator

# Global clock publisher (Clock_Publisher_Graph). Not tied to any robot,
# so it lives in its own builder (action_graphs/clock.py).
clock:
  enabled: true
  clock_topic: clock                  # ROS2PublishClock.topicName (USD: default)
