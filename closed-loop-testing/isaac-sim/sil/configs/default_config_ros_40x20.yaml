# 40x20 TWO-DOCK variant of default_config_ros_2fl.yaml — identical except
# base_stage_asset_path points at the collected 40x20 scene. Launch with
# BOTH flags (plus COMPOSE_PROFILES including `multi-robot`):
#   ./run_sdg.sh -c /isaac-sim/sil/configs/default_config_ros_40x20.yaml \
#     --robots-config /isaac-sim/sil/configs/robots-40x20.yaml \
#     --cameras-config /isaac-sim/sil/configs/cameras-40x20.yaml ...
# Keep everything below in sync by hand with default_config_ros.yaml.
#
# The scene is a Collect As bundle, not a single file: the root layer below
# resolves its dependencies through relative paths next to it, so the .usd
# and its sibling asset folders must move together.
#
# The three behavior trees keep their 20x20 endpoints: this scene shares the
# dock-1 coordinate frame, and all six points were checked against the 40x20
# navmesh (walkable with 0.5 m clearance). Endpoint B of each tree must stay in
# sync with _HALOS_CHAR_SPAWN_TARGETS in runtime_patches/halos_runtime_patches.py.
#
# TODO(40x20): no character endpoint sits on forklift_b2's lane (nearest is
# 3.4 m), so the second robot never sees a person and raises no safety event.
isaacsim.replicator.agent:
  version: 1.6.0
  seed: 42
  simulation_duration: 600.0
  environment:
    base_stage_asset_path: /isaac-sim/sil/scenes/warehouse_40x20_2fl/warehouse_40x20_Halos_two_loading_dock_split_doors.usd
  character:
    groups:
      inspect_workers:
        num: 1
        asset_path: https://omniverse-content-staging.s3-us-west-2.amazonaws.com/Assets/Isaac/6.0/Isaac/People/Characters/
        behavior_tree: /isaac-sim/sil/configs/inspect_loop.bt.json
      gather_workers:
        num: 1
        asset_path: https://omniverse-content-staging.s3-us-west-2.amazonaws.com/Assets/Isaac/6.0/Isaac/People/Characters/
        behavior_tree: /isaac-sim/sil/configs/gather_bend_loop.bt.json
      pickup_workers:
        num: 1
        asset_path: https://omniverse-content-staging.s3-us-west-2.amazonaws.com/Assets/Isaac/6.0/Isaac/People/Characters/
        behavior_tree: /isaac-sim/sil/configs/pickup_loop.bt.json
    motion_library_path: https://omniverse-content-staging.s3.us-west-2.amazonaws.com/Assets/Behavior/110.0/Samples/Assets/MotionLibrary/Human/HumanMotionLibrary.usd
  sensor:
    groups:
      ceiling_cameras:
        num: 3
        aim_at_targets:
          height_range:
          - 2.0
          - 3.0
          look_down_angle_range:
          - 0.0
          - 60.0
          focal_length_range:
          - 10.0
          - 15.0
          distance_range:
          - 6.5
          - 14.5
  replicator:
    writers:
      IRABasicWriter:
        output_dir: ''
        rgb: false
        bounding_box_2d_tight: false
        bounding_box_2d_loose: false
        bounding_box_3d: false
        normals: false
        semantic_segmentation: false
        instance_id_segmentation: false
        instance_segmentation: false
        camera_params: false
        start_frame: 0
        end_frame: 1800
        sensor_prim_list:
        - /World/Cameras/ceiling_cameras
