# Camera Configuration — Halos SIL on Isaac Sim 6.0
# ----------------------------------------------------
# New schema for `isaacsim.streaming.rtsp` extension (replaces legacy `RTSPWriter`).
# Each camera spawns its own in-process RTSP server -> port must be unique per camera.
# Legacy `mediamtx` broker is dropped entirely (Isaac Sim 6.0 self-hosts RTSP).
#
# Per-camera fields:
#   - name        : display name in VST
#   - port        : TCP port of the in-process RTSP server (unique per camera)
#   - mount_path  : URL suffix (must start with "/")
#   - camera_prim : USD prim path of the camera in the stage
#
# RTSP URL build formula (consumed by VST registration in vst_sensor_manager.py):
#
#     url = f"rtsp://{cfg['rtsp']['host']}:{cam['port']}{cam['mount_path']}"
#
# Examples:
#     rtsp://${HOST_IP}:8554/camera
#     rtsp://${HOST_IP}:8555/camera_01
#     rtsp://${HOST_IP}:8556/camera_02
#
# Diff vs Isaac Sim 5.1 schema:
#   - REMOVE field `rtsp_path` (string `RTSPWriter_World_Cameras_*_rgb`)
#   - REMOVE top-level `rtsp.port: 8553` (mediamtx broker)
#   - ADD per-camera `port`, `mount_path`, `camera_prim`
#   - KEEP top-level `rtsp.host: ${HOST_IP}` so vst_sensor_manager.py builds URL

cameras:
  - name: Camera
    camera_prim: /World/Cameras/Camera
    port: 8554
    mount_path: /camera

  - name: Camera_01
    camera_prim: /World/Cameras/Camera_01
    port: 8555
    mount_path: /camera_01

  - name: Camera_02
    camera_prim: /World/Cameras/Camera_02
    port: 8556
    mount_path: /camera_02

# RTSP Server Configuration
# Only `host` remains at top level -- port is now per-camera above.
rtsp:
  host: ${HOST_IP}
