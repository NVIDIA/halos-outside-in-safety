# What to run. One entry per scenario; the key is the id, and `SCENARIO=<id>` in
# the profile env picks one. Isaac and every forklift controller read the same
# id, so they cannot end up on different halves of one run.
#
# A scenario says what to run. Where to run it — host IP, data paths, GPU,
# docker gid — stays in deployments/profiles/*.env. A command-line flag still
# wins over a scenario, for a one-off run.
#
#   ira        IRA config. The scene USD is named inside it, so it is not repeated here
#   robots     fleet file: which trucks exist and how each drives
#   cameras    camera config; its `scene:` key is cross-checked against the IRA scene at load
#   waypoints  directory under forklift-controller/waypoints/, holding <robot>.json per truck
#   experimental  true = no published calibration, so perception geometry does not
#                 match this scene. Run it to watch trucks drive; do not score it.

warehouse_20x20_1fl:
  ira:       default_config_ros.yaml
  robots:    robots.yaml
  cameras:   cameras.yaml
  waypoints: warehouse_20x20

# Both trucks are baked into this scene rather than spawned, and it shares the
# 20x20 calibration, so its numbers mean what the one-forklift numbers mean.
# Needs COMPOSE_PROFILES to include `multi-robot` for the second controller.
warehouse_20x20_2fl:
  ira:       default_config_ros_2fl.yaml
  robots:    robots-2fl.yaml
  cameras:   cameras.yaml
  waypoints: warehouse_20x20

# Trucks spawned from the robots file rather than baked in. No calibration is
# published for this warehouse, so VSS runs 20x20 geometry against a different
# building: cameras stream, perception detects, PSF issues verdicts — about the
# wrong place, and nothing logs a warning.
warehouse_40x20:
  ira:       default_config_ros_40x20.yaml
  robots:    robots-40x20.yaml
  cameras:   cameras-40x20.yaml
  waypoints: warehouse_40x20
  experimental: true
