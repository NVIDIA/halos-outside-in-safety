# RTX post-processing presets — in-scenario sensor-anomaly injection
# ------------------------------------------------------------------
# Injects visual degradation (low light, colour cast, flicker, sensor grain)
# into the rendered image. Because RTX runs post-processing before the encoder,
# a preset shows up in the viewport, in the SDG RGB output and on every RTSP
# stream at once — no graph rebuild, and data generation never has to start.
#
# Switching preset while the sim is running:
#
#     edit `active:` below and save          (run_actor_sdg.py polls this file)
#     ./scripts/postprocessing/set_preset.sh tv_noise
#
# Scope. A preset with no `cameras:` key sets carb settings, which affect the
# viewport and every camera — "the whole site went dark". Adding `cameras:`
# authors USD attributes on those cameras instead, so only they degrade —
# "camera 2 is dirty", which is the case an anomaly campaign usually wants.
# `per_camera:` goes one step further and gives every camera its own settings
# block, for "camera 1 went dark WHILE camera 2 went grainy" — see mixed_faults.
# Each `per_camera:` entry can also carry its own `animation:` block, so cameras
# can flicker at different rates or out of phase — see anim_* below.
#
# Per-camera caveat: exposure lives on the camera prim and applies at once, but
# grain / scanlines / vignetting / colour grading live on the RENDER PRODUCT,
# which the RTSP graph only creates on the first tick after Play. Those settings
# stay pending until Play and the log says so.
#
# Every key below is validated against an allow-list (scripts/postprocessing/
# effects.py) transcribed from the Kit renderer source, so a typo is rejected
# with the preset name and key rather than silently creating a dead carb key.
# A rejected edit keeps the previously applied preset running.

version: 1

# Which preset is live. Quote names that YAML would read as booleans (off, no).
active: baseline

presets:
  # Renderer defaults — what the pipeline looks like with no anomaly.
  baseline:
    description: No degradation. The reference look for a golden run.
    settings: {}

  # Sudden low light: lamp failure, dusk, or an under-exposed sensor.
  # Auto-exposure must go off first, or the histogram claws the image back to
  # a normal brightness within about a second and the anomaly disappears.
  low_light:
    description: Sudden low light — ISO 12 against a nominal 100.
    settings:
      auto_exposure.enabled: false
      exposure.iso: 12.0

  # White-balance drift: a warm cast that shifts every colour-based cue
  # without changing geometry, so tracking should survive and colour
  # classification should not.
  hue_shift:
    description: Warm colour cast (white-balance drift), R up / B down ~3%.
    settings:
      grade.enabled: true
      grade.gain: [1.03, 1.0, 0.97]

  # Mains flicker / failing luminaire: sensor gain swings around its base.
  #
  # Keep frequency_hz below half the rate that is actually achieved, or the
  # anomaly you ship is not the anomaly the consumer sees. TWO rates are in play
  # and they are not the same number.
  #
  # The animation is sampled once per RENDERED frame. This warehouse measured
  # 17.8 fps on both SIL boxes, so the injected sine itself holds up to ~8.9 Hz.
  # What a consumer can reconstruct is bounded by what its capture DELIVERS,
  # which is lower: the RTSP stream declares 30 fps and delivered ~8 when this
  # was captured. On that capture 1 Hz and 2 Hz requests read back at 1.0 and
  # 1.8 Hz — the residual is the error in estimating the delivered rate — while
  # 6 Hz folded to an unambiguous 3.0 Hz. A 6 Hz signal folding to 3.0 Hz is the
  # signature of sampling near 9 Hz, which is the DELIVERY ceiling, not the
  # render one. Check both before raising this.
  #
  # This animates ISO, not shutter, and that is deliberate. The obvious knob,
  # exposure.time, does nothing at global scope in a running sim: something in
  # the render loop rewrites /rtx/post/tonemap/exposureTime every frame, so our
  # value never survives to the tonemapper. Measured over 8 RTSP frames, a
  # +/-35% shutter swing left brightness flat (std 1.3) against a scene-motion
  # noise floor of std 8.1, while this ISO version swings std 22.7 / range 61.
  # Shutter flicker DOES work when scoped to `cameras:`, because that authors
  # exposure:time on the camera prim instead of setting carb -- see the note on
  # exposure.time in effects.py.
  flicker:
    description: 2 Hz brightness flicker, +/-35% around ISO 100.
    settings:
      auto_exposure.enabled: false
      exposure.iso: 100.0
    animation:
      target: exposure.iso
      waveform: sine
      base: 100.0
      amplitude_fraction: 0.35
      frequency_hz: 2.0

  # Degraded stream: sensor grain plus scanlines, the classic "bad analog
  # camera" look. Grain amount tops out at 0.2. Note that scanline severity is
  # not tunable — the shader always swings +/-25% and `spread` only sets the
  # band spacing (1.0 is ~86 bands on a 540-line image).
  tv_noise:
    description: Sensor grain + scanlines (degraded/noisy stream).
    settings:
      tv_noise.enabled: true
      tv_noise.film_grain.enabled: true
      tv_noise.film_grain.amount: 0.12
      tv_noise.scanlines.enabled: true
      tv_noise.scanlines.spread: 1.0

  # Soft lens obstruction: a heavy vignette pinches the usable image down to
  # the centre. Not a true blockage — an opaque occluder prim in front of the
  # lens is still the only way to model that — but it degrades the frame
  # border-first the way grime or a misfitted housing does.
  #
  # size MUST be 2.0 here, and that is not a typo for the documented default of
  # 107. The RTX vignette is unnormalised: centre gain is 0.0625 * (size + 14),
  # so 107 multiplies the middle of the frame by ~7.6 and burns it to pure white
  # (verified by capture — the pallets disappear entirely). 2.0 gives a centre
  # gain of exactly 1.0, leaving `strength` as the only knob that matters.
  #
  # strength is calibrated by capture, because the real falloff is steeper than
  # the shader formula predicts per pixel. Ratio of centre brightness to border
  # brightness on the RTSP frame, which sits at 0.86-0.96 with no vignette:
  #
  #     0.2 -> 1.5    0.4 -> 2.2    0.8 -> 4.4    1.6 -> 17.3
  #
  # 1.6 is not a vignette, it is a spotlight: the border falls to 1/17 of the
  # centre and whole-frame brightness drops 70%. 0.8 keeps the centre usable
  # while the border loses objects, which is the failure this preset is for.
  vignette_heavy:
    description: Heavy vignette — soft lens obstruction / grimy housing.
    settings:
      tv_noise.enabled: true
      tv_noise.film_grain.enabled: false
      tv_noise.vignetting.enabled: true
      tv_noise.vignetting.size: 2.0
      tv_noise.vignetting.strength: 0.8

  # Same grain as tv_noise but with the renderer's time input frozen, the intent
  # being that two runs of one scenario render identical noise — per-frame
  # randomness would defeat diffing in a regression campaign. Unlike the other
  # presets here this one is not verified: proving it takes two runs compared
  # frame by frame.
  tv_noise_deterministic:
    description: tv_noise with a frozen time seed, for seeded re-execution.
    settings:
      tv_noise.enabled: true
      tv_noise.film_grain.enabled: true
      tv_noise.film_grain.amount: 0.12
      tv_noise.scanlines.enabled: true
      tv_noise.fixed_time.seed: true
      tv_noise.fixed_time.seed_count: 12.0

  # One camera degrades while the rest stay clean — the shape of a real
  # anomaly scenario. `cameras:` takes cameras.yaml names or full prim paths.
  one_camera_degraded:
    description: Camera_01 alone goes dark and grainy; other cameras unaffected.
    cameras: [Camera_01]
    settings:
      auto_exposure.enabled: false
      exposure.iso: 20.0
      tv_noise.enabled: true
      tv_noise.film_grain.enabled: true
      tv_noise.film_grain.amount: 0.15

  # Two cameras, two different faults, at the same time. `cameras:` cannot do
  # this: it has one `settings` block, so every camera it lists gets the same
  # degradation — and because only one preset is active, applying a Camera_01
  # preset and then a Camera_02 preset reverts the first. `per_camera:` gives
  # each camera its own block and applies them in one pass. It cannot be
  # combined with the TOP-LEVEL `cameras:`/`settings:`/`animation:` keys —
  # `settings:` and `animation:` go inside each per_camera entry instead.
  mixed_faults:
    description: Camera_01 goes dark while Camera_02 goes grainy, together.
    per_camera:
      Camera_01:
        settings:
          auto_exposure.enabled: false
          exposure.iso: 12.0
      Camera_02:
        settings:
          tv_noise.enabled: true
          tv_noise.film_grain.enabled: true
          tv_noise.film_grain.amount: 0.18

  # --- Animated per-camera presets -------------------------------------------
  # Every per_camera entry can carry its own `animation:` block, so one camera
  # can flicker while another sits still, or two can flicker out of step. All
  # groups share one clock origin, latched at apply, and `phase_deg` (optional,
  # default 0, range [0, 360)) offsets one against another:
  #
  #     value = base * (1 + amplitude_fraction * sin(2*pi*f*(t - t0) + phase_deg))
  #
  # `auto_exposure.enabled: false` has to be repeated in EVERY entry that
  # animates exposure — there is no top-level `settings:` in a per_camera preset
  # to put it in, and with auto-exposure left on the histogram pulls the image
  # back to normal brightness in about a second and the flicker vanishes.

  # Cross-term check: does an animated group leak onto a static one? Camera_01
  # flickers, Camera_02 holds a fixed grain level and must not move with it.
  anim_mixed:
    description: Camera_01 flickers at 1 Hz while Camera_02 sits at static grain.
    per_camera:
      Camera_01:
        settings:
          auto_exposure.enabled: false
          exposure.iso: 100.0
        animation:
          target: exposure.iso
          waveform: sine
          base: 100.0
          amplitude_fraction: 0.35
          frequency_hz: 1.0
      Camera_02:
        settings:
          tv_noise.enabled: true
          tv_noise.film_grain.enabled: true
          tv_noise.film_grain.amount: 0.18

  # Two independent frequencies on the same target. The sine is sampled once per
  # rendered frame, so the achieved frame rate sets the ceiling: this warehouse
  # measured 17.8 fps on both SIL boxes, putting the alias threshold near 8.9 Hz
  # and giving this preset's 3 Hz about 5.9 samples per cycle -- comfortably
  # resolved. Samples per cycle is just achieved_fps / frequency_hz: below 2 the
  # signal folds to a different frequency, and only a little above 2 it is
  # coarse. The ceiling belongs to the host, not the scene, so check the rate
  # yours achieves. See the note on `flicker` above: what a CONSUMER can
  # reconstruct is bounded by the delivered rate instead, which is lower.
  anim_two_freq:
    description: Camera_01 flickers at 1 Hz, Camera_02 at 3 Hz, same target.
    per_camera:
      Camera_01:
        settings:
          auto_exposure.enabled: false
          exposure.iso: 100.0
        animation:
          target: exposure.iso
          waveform: sine
          base: 100.0
          amplitude_fraction: 0.35
          frequency_hz: 1.0
      Camera_02:
        settings:
          auto_exposure.enabled: false
          exposure.iso: 100.0
        animation:
          target: exposure.iso
          waveform: sine
          base: 100.0
          amplitude_fraction: 0.35
          frequency_hz: 3.0

  # Antiphase: same frequency, half a cycle apart, so Camera_01 is at its
  # brightest exactly when Camera_02 is at its dimmest. This is the case a
  # shared clock origin alone cannot produce — both groups are applied in the
  # same tick, so without `phase_deg` they would be locked in step.
  anim_antiphase:
    description: Both cameras flicker at 1 Hz, 180 degrees apart.
    per_camera:
      Camera_01:
        settings:
          auto_exposure.enabled: false
          exposure.iso: 100.0
        animation:
          target: exposure.iso
          waveform: sine
          base: 100.0
          amplitude_fraction: 0.35
          frequency_hz: 1.0
          phase_deg: 0
      Camera_02:
        settings:
          auto_exposure.enabled: false
          exposure.iso: 100.0
        animation:
          target: exposure.iso
          waveform: sine
          base: 100.0
          amplitude_fraction: 0.35
          frequency_hz: 1.0
          phase_deg: 180

  # Breathing grain rather than breathing brightness. This is the EXPENSIVE
  # shape and the controller says so on load: grain lives on the render product,
  # which is found by traversing the stage, so an animated render-product target
  # at per-camera scope traverses once per animated scope per frame. A preset of
  # this shape previously measured -7.0% FPS with the robot driving. It is a
  # warning, not a rejection — animating grain on one camera is a real anomaly.
  # tv_noise.enabled and film_grain.enabled must both be on, or animating the
  # amount drives a pass that is switched off.
  anim_rp_target:
    description: Camera_01 grain breathes at 0.5 Hz (render-product target — costly).
    per_camera:
      Camera_01:
        settings:
          tv_noise.enabled: true
          tv_noise.film_grain.enabled: true
          tv_noise.film_grain.amount: 0.12
        animation:
          target: tv_noise.film_grain.amount
          waveform: sine
          base: 0.12
          amplitude_fraction: 0.6
          frequency_hz: 0.5
