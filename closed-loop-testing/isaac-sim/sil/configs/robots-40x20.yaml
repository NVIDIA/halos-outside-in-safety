# Halos SIL forklift / robot Action Graph config (6.0) — 40x20 TWO-DOCK variant.
#
# Same two-robot layout as robots-2fl.yaml, retargeted to the 40x20 scene. To
# run this variant:
#   1. Scene must contain /World/forklift_b2 (a clone of /World/forklift_b —
#      same ForkliftB asset payload). Paired IRA config:
#      configs/default_config_ros_40x20.yaml points at
#        /isaac-sim/sil/scenes/warehouse_40x20_two_loading_dock.usd
#      run_actor_sdg fails fast if a listed articulation prim is missing.
#   2. Launch Isaac with the 40x20 config trio:
#        -c /isaac-sim/sil/configs/default_config_ros_40x20.yaml \
#        --robots-config /isaac-sim/sil/configs/robots-40x20.yaml \
#        --cameras-config /isaac-sim/sil/configs/cameras-40x20.yaml
#   3. COMPOSE_PROFILES must include `multi-robot` so the second controller
#      container (forklift-controller-b2) starts.
#
# The safety_indicator disc is NOT in this scene's USD: indicator_loader.py
# authors it from the `mesh:` blocks below, before the graph builder runs. The
# 20x20 scenes still carry a baked disc and declare no `mesh:` block, so the
# loader is a no-op for them. Declaring `mesh:` while a baked disc still sits at
# the same prim path is an error — two sources of truth for one prim.
#
# One block per robot. Add a robot = add a block here + a controller service
# (forklift-controller.yml) + the prim in the scene. The TGS rebalance list in
# runtime_patches/halos_runtime_patches.py is derived from this file.

robots:
  - name: forklift_b
    # Articulation root prim (was articulation_controller.inputs:targetPrim
    # and isaac_compute_odometry_node.inputs:chassisPrim = /World/forklift_b).
    articulation_prim: /World/forklift_b

    # --- control (ROS_Forklift_Control_Graph) ---
    control:
      enabled: true
      cmd_vel_topic: forklift_b/cmd_vel # per-robot namespace (controller USE_NAMESPACE=true; FORKLIFT_* vars in sil.env/hil.env)
      drive_joint: back_wheel_drive   # velocity-controlled wheel joint
      swivel_joint: back_wheel_swivel # position-controlled steer joint
      wheelbase: 1.49                 # constant_double_wheelbase
      wheel_radius: 0.15              # constant_double_WheelRadius
      max_steer_deg: 45.0             # SwivelIK MAX_STEER = radians(45)
      # Frame-convention sign flips (vehicle frame vs ROS frame). The original
      # baked SwivelIK negated both inputs, so both default to true. Set false
      # if the robot asset already matches the ROS twist convention.
      reverse_logic:
        flip_linear_x: true           # negate cmd_vel linear.x
        flip_angular_z: true          # negate cmd_vel angular.z

    # --- odometry (Odometry_Graph) ---
    odometry:
      enabled: true
      odom_topic: forklift_b/odom     # per-robot namespace
      tf_topic: tf                    # ROS2PublishRawTransformTree.topicName (USD: default)
      robot_front: [-1.0, 0.0, 0.0]   # ros2_publish_odometry.inputs:robotFront
      # TF frame ids default to <name>/odom -> <name>/base_link, so the trucks do
      # not publish the same edge onto one /tf. Override with odom_frame_id /
      # base_frame_id to get the bare ROS names back.

    # --- safety indicator (Safety_indicator_Graph) ---
    safety_indicator:
      enabled: true
      muted_topic: /safety/is_muted   # std_msgs/Bool subscriber
      indicator_prim: /World/forklift_b/body/body/safety_indicator
      # RGB 0..1, read by the Action Graph on every state change. Outside
      # `mesh:` on purpose: a scene with a baked disc has no mesh block and can
      # still repaint. These two values are the defaults.
      color_muted: [0.0, 1.0, 0.0]    # loading allowed
      color_alarm: [1.0, 0.3, 0.0]    # resting state, also the disc's initial colour
      # Disc geometry comes from indicator_loader.py, not from the scene USD.
      # Every field is optional and defaults to the values below, which are the
      # ones the 20x20 scene authored by hand. Drop the whole block to go back
      # to requiring a baked disc in the scene.
      mesh:
        radius: 1.5                   # metres, final world-space size
        segments: 32
        height_offset: 0.0

  # Second forklift: scene-side prim is a clone of /World/forklift_b
  # (same ForkliftB asset payload -> same joints/params).
  # Contract: name == controller ROBOT_ID == prim leaf name.
  - name: forklift_b2
    articulation_prim: /World/forklift_b2

    control:
      enabled: true
      cmd_vel_topic: forklift_b2/cmd_vel
      drive_joint: back_wheel_drive   # same asset as forklift_b
      swivel_joint: back_wheel_swivel
      wheelbase: 1.49
      wheel_radius: 0.15
      max_steer_deg: 45.0
      reverse_logic:
        flip_linear_x: true
        flip_angular_z: true

    odometry:
      enabled: true
      odom_topic: forklift_b2/odom
      tf_topic: tf                    # frame ids default to forklift_b2/odom -> .../base_link
      robot_front: [-1.0, 0.0, 0.0]

    safety_indicator:
      enabled: true
      muted_topic: /safety/is_muted   # shared global mute (per-forklift mute deferred)
      indicator_prim: /World/forklift_b2/body/body/safety_indicator
      color_muted: [0.0, 1.0, 0.0]
      color_alarm: [1.0, 0.3, 0.0]
      mesh:
        radius: 1.5
        segments: 32
        height_offset: 0.0

# Global clock publisher (Clock_Publisher_Graph). Not tied to any robot,
# so it lives in its own builder (action_graphs/clock.py).
clock:
  enabled: true
  clock_topic: clock                  # ROS2PublishClock.topicName (USD: default)
