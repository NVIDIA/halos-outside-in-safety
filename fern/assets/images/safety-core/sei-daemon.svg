<text x="735.0" y="683.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">one request in flight,</text>
<text x="735.0" y="706.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">bounded retry</text>
<text x="735.0" y="734" text-anchor="middle" fill="#f2859f" font-size="13.5">first stamp kept; delivery fail-safe</text>
<rect x="1040" y="600" width="370" height="150" rx="10" fill="#262a30" stroke="#f3a65a" stroke-width="2.5"/>
<circle cx="1060" cy="620" r="5" fill="none" stroke="#f3a65a" stroke-width="1.5" opacity="0.8"/>
