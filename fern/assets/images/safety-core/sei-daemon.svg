<text x="735.0" y="423.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">required sources;</text>
<text x="735.0" y="446.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">monitor and MDX-instance loss</text>
<text x="735.0" y="474" text-anchor="middle" fill="#f2859f" font-size="13.5">SW_FAIL 15 / 17 / 18</text>
<rect x="1040" y="340" width="370" height="150" rx="10" fill="#1d2550" stroke="#a996f5" stroke-width="2.5"/>
<circle cx="1060" cy="360" r="5" fill="none" stroke="#a996f5" stroke-width="1.5" opacity="0.8"/>
<text x="1225.0" y="393.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Trust and Sensor Health</text>
<text x="1225.0" y="423.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">cameras (2D), BEV group (3D),</text>
<text x="1225.0" y="446.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">AI pipeline</text>
<text x="1225.0" y="474" text-anchor="middle" fill="#a996f5" font-size="13.5">standing INVALID re-asserted</text>
<rect x="1530" y="340" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="1550" cy="360" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
