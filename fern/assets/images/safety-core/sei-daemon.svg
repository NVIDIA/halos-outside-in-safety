<text x="1225.0" y="186.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">pipeline range, trust reporter</text>
<text x="1225.0" y="214" text-anchor="middle" fill="#f2859f" font-size="13.5">rejection streak: SW_FAIL 13</text>
