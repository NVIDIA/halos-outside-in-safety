<text x="1715.0" y="706.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">SEI status</text>
<text x="1715.0" y="734" text-anchor="middle" fill="#53d6b6" font-size="13.5">trust kept from queue time</text>
