<text x="1715.0" y="434.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">staleness, correlation, routing</text>
<text x="1715.0" y="474" text-anchor="middle" fill="#f2859f" font-size="13.5">sustained failure: SEI ERROR</text>
