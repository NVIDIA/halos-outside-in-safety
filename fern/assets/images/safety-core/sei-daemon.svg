<text x="1225.0" y="694.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">critical and operational lanes</text>
<text x="1225.0" y="734" text-anchor="middle" fill="#f3a65a" font-size="13.5">evict distrusted; refuse: ERROR, keep</text>
