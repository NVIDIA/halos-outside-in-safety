<text x="735.0" y="963.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">every status interval</text>
<text x="735.0" y="986.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">(default 5 s)</text>
<text x="735.0" y="1014" text-anchor="middle" fill="#53d6b6" font-size="13.5">carries the presence report (cause 16)</text>
<rect x="1530" y="880" width="370" height="150" rx="10" fill="#1a2c3b" stroke="#8db4c8" stroke-width="2.5"/>
<circle cx="1550" cy="900" r="5" fill="none" stroke="#8db4c8" stroke-width="1.5" opacity="0.8"/>
