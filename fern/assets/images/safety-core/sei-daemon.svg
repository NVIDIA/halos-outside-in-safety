<text x="245.0" y="446.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">3D group file</text>
<text x="245.0" y="474" text-anchor="middle" fill="#a996f5" font-size="13.5">read once at startup; strict</text>
<rect x="550" y="340" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="570" cy="360" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
