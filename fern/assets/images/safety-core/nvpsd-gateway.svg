<text x="735.0" y="174.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">register, heartbeat, receive</text>
<text x="735.0" y="214" text-anchor="middle" fill="#f2859f" font-size="13.5">AF_UNIX SOCK_SEQPACKET</text>
<rect x="1040" y="80" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="1060" cy="100" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
<text x="1225.0" y="139.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Request Validator</text>
<text x="1225.0" y="169.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">schema, request ID</text>
<text x="1225.0" y="192.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">and continuity</text>
<rect x="1530" y="80" width="370" height="150" rx="10" fill="#11313a" stroke="#53d6b6" stroke-width="2.5"/>
<circle cx="1550" cy="100" r="5" fill="none" stroke="#53d6b6" stroke-width="1.5" opacity="0.8"/>
<text x="1715.0" y="139.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Subscription Router</text>
<text x="1715.0" y="169.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">per-SDM event-type</text>
<text x="1715.0" y="192.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">filtering and fan-out</text>
<rect x="550" y="340" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="570" cy="360" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
<text x="735.0" y="393.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Recovery Record</text>
<text x="735.0" y="423.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">all-client record (cause 14)</text>
<text x="735.0" y="446.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">once the SEI link recovers</text>
<text x="735.0" y="474" text-anchor="middle" fill="#f2859f" font-size="13.5">owed per client until sent</text>
<rect x="1040" y="340" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="1060" cy="360" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
<text x="1225.0" y="399.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Fault Synthesizer</text>
<text x="1225.0" y="429.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">SW_FAIL on request-ID gap or</text>
<text x="1225.0" y="452.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">invalid ID (10, 11), SEI ERROR (12)</text>
<rect x="1530" y="340" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="1550" cy="360" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
<text x="1715.0" y="404.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Envelope Builder</text>
<text x="1715.0" y="434.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">CRC, epoch, tx sequence</text>
<text x="1715.0" y="474" text-anchor="middle" fill="#f2859f" font-size="13.5">sequence spent even if the send fails</text>
<rect x="60" y="600" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="80" cy="620" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
