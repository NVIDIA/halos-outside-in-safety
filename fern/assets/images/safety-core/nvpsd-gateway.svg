<text x="245.0" y="689.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">SO_PEERCRED group check,</text>
<text x="245.0" y="712.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">admission-timeout reaper</text>
<rect x="550" y="600" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="570" cy="620" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
<text x="735.0" y="653.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Registration</text>
<text x="735.0" y="683.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">REGR validation,</text>
<text x="735.0" y="706.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">per-peer rate limit</text>
<text x="735.0" y="734" text-anchor="middle" fill="#f2859f" font-size="13.5">refusal answered with RGNK + reason</text>
<rect x="1040" y="600" width="370" height="150" rx="10" fill="#1d2550" stroke="#a996f5" stroke-width="2.5"/>
<circle cx="1060" cy="620" r="5" fill="none" stroke="#a996f5" stroke-width="1.5" opacity="0.8"/>
<text x="1225.0" y="670.0" text-anchor="middle" fill="#e9eef3" font-size="21" font-weight="700">Registered SDM Table</text>
<text x="1225.0" y="700.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">identity and subscriptions</text>
<rect x="1530" y="600" width="370" height="150" rx="10" fill="#262a30" stroke="#f3a65a" stroke-width="2.5"/>
<circle cx="1550" cy="620" r="5" fill="none" stroke="#f3a65a" stroke-width="1.5" opacity="0.8"/>
