<text x="1715.0" y="963.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">ATL, PXC, ATL+PXC,</text>
<text x="1715.0" y="986.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">fsicom-agent (FSI SDMs)</text>
<text x="1715.0" y="1014" text-anchor="middle" fill="#8db4c8" font-size="13.5">/run/nvpsf/nvpsd_gateway</text>
