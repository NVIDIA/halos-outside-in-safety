<text x="1225.0" y="969.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">tiered health: degraded,</text>
<text x="1225.0" y="992.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">then slot reclaimed</text>
