<text x="1715.0" y="694.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">drop and count on backpressure</text>
<text x="1715.0" y="734" text-anchor="middle" fill="#f3a65a" font-size="13.5">AF_UNIX SOCK_SEQPACKET, fixed</text>
<rect x="1040" y="880" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="1060" cy="900" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
