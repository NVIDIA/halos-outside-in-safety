<text x="245.0" y="180.0" text-anchor="middle" fill="#9fb4c5" font-size="15.5">DecisionRequest producer</text>
<rect x="550" y="80" width="370" height="150" rx="10" fill="#24222f" stroke="#f2859f" stroke-width="2.5"/>
<circle cx="570" cy="100" r="5" fill="none" stroke="#f2859f" stroke-width="1.5" opacity="0.8"/>
