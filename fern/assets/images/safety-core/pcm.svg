<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1140" width="2000" height="1140" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono','Liberation Mono',monospace" role="img" aria-label="PCM (nv_perception_monitor): container health over the Docker socket, decision-data validation of mdx-frames, the debounced pipeline verdict and the SEI client">
<title>PCM (nv_perception_monitor): container health over the Docker socket, decision-data validation of mdx-frames, the debounced pipeline verdict and the SEI client</title>
<defs>
