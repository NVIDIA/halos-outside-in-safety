<path d="M 430.0 870.0 L 550.0 870.0" fill="none" stroke="#a996f5" stroke-width="2.6" stroke-dasharray="9 7" stroke-linejoin="round" marker-end="url(#arrow-config)"/>
<path d="M 430.0 820.0 L 490.0 820.0 L 490.0 670.0 L 550.0 670.0" fill="none" stroke="#a996f5" stroke-width="2.6" stroke-dasharray="9 7" stroke-linejoin="round" marker-end="url(#arrow-config)"/>
<path d="M 920.0 390.0 L 980.0 390.0 L 980.0 480.0 L 1040.0 480.0" fill="none" stroke="#53d6b6" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<path d="M 920.0 630.0 L 980.0 630.0 L 980.0 540.0 L 1040.0 540.0" fill="none" stroke="#53d6b6" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<path d="M 1225.0 600.0 L 1225.0 780.0" fill="none" stroke="#53d6b6" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<path d="M 1410.0 870.0 L 1530.0 870.0" fill="none" stroke="#f2859f" stroke-width="2.6" stroke-dasharray="9 7" stroke-linejoin="round" marker-end="url(#arrow-safety)"/>
<rect x="1380.8" y="751" width="178.4" height="21" rx="4" fill="#0a1520"/>
<text x="1470" y="766" text-anchor="middle" fill="#f2859f" font-size="13.5">pipeline verdict</text>
<text x="1530" y="100" text-anchor="start" fill="#9fb4c5" font-size="15" font-weight="400">LEARN runs the DVM only, writes</text>
<text x="1530" y="124" text-anchor="start" fill="#9fb4c5" font-size="15" font-weight="400">pcm_baseline.cfg and does not</text>
<text x="1530" y="148" text-anchor="start" fill="#9fb4c5" font-size="15" font-weight="400">register with the SEI.</text>
<text x="1530" y="196" text-anchor="start" fill="#9fb4c5" font-size="15" font-weight="400">Every SDM latches its safe state</text>
<text x="1530" y="220" text-anchor="start" fill="#9fb4c5" font-size="15" font-weight="400">on AI_PIPELINE_INVALID.</text>
<text x="1530" y="268" text-anchor="start" fill="#9fb4c5" font-size="15" font-weight="400">A setup problem turns a check off;</text>
<text x="1530" y="292" text-anchor="start" fill="#9fb4c5" font-size="15" font-weight="400">it never sends INVALID.</text>
<text x="70" y="1070" fill="#e9eef3" font-size="20" font-weight="700">Legend</text>
<rect x="70" y="1088" width="30" height="20" rx="4" fill="#1d2550" stroke="#a996f5" stroke-width="2"/>
<text x="110" y="1104" fill="#9fb4c5" font-size="16">Configuration / state</text>
<rect x="350" y="1088" width="30" height="20" rx="4" fill="#1a2c3b" stroke="#8db4c8" stroke-width="2"/>
<text x="390" y="1104" fill="#9fb4c5" font-size="16">External</text>
<rect x="500" y="1088" width="30" height="20" rx="4" fill="#24222f" stroke="#f2859f" stroke-width="2"/>
<text x="540" y="1104" fill="#9fb4c5" font-size="16">Safety check</text>
<rect x="690" y="1088" width="30" height="20" rx="4" fill="#262a30" stroke="#f3a65a" stroke-width="2"/>
<text x="730" y="1104" fill="#9fb4c5" font-size="16">Transport</text>
<line x1="850" y1="1098" x2="890" y2="1098" stroke="#a996f5" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrow-config)"/>
<text x="902" y="1104" fill="#9fb4c5" font-size="16">reads configuration</text>
<line x1="1120" y1="1098" x2="1160" y2="1098" stroke="#53d6b6" stroke-width="2.6" marker-end="url(#arrow-data)"/>
<text x="1172" y="1104" fill="#9fb4c5" font-size="16">data flow</text>
<line x1="1290" y1="1098" x2="1330" y2="1098" stroke="#f2859f" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrow-safety)"/>
<text x="1342" y="1104" fill="#9fb4c5" font-size="16">validated / safety handoff</text>
