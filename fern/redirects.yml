redirects:
  # Legacy Sphinx links. Akamai redirects /halos-outside-in/* to the landing page
  # (release notes excepted), so these only cover direct links on the Fern base
  # path. Sphinx-only pages go to the landing page; other pages drop the .html
  # or /index.html suffix and keep their path.
  - source: /halos/outside-in-safety/(index|genindex|search).html
    destination: /halos/outside-in-safety
  - source: /halos/outside-in-safety/:path([A-Za-z0-9].*)/index.html
    destination: /halos/outside-in-safety/:path
  - source: /halos/outside-in-safety/:path([A-Za-z0-9].*).html
    destination: /halos/outside-in-safety/:path
