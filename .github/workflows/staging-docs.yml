# Publishes a Fern staging preview of docs.nvidia.com/halos-outside-in on
# pushes to main that touch docs or fern/.
# Requires the DOCS_FERN_TOKEN repo secret.

name: staging-docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/staging-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Runs never overlap. Without cancel-in-progress, GitHub keeps only the newest
# pending run, so the latest push to main always publishes last.
concurrency:
  group: staging-docs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI tool
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Generate staging preview
        shell: bash
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          # bash -eo pipefail keeps Fern failures fatal while tee shows the logs.
          # The ID is repo-qualified because the nvidia-halos instance is multi-source.
          fern generate --docs --preview --id halos-outside-in-staging 2>&1 | tee fern-output.txt
          URL=$(sed -nE 's/.*Published docs to (https:\/\/[^[:space:]]+).*/\1/p' fern-output.txt | head -n 1)
          if [ -z "$URL" ]; then
            echo "::error::Fern did not return a staging URL. Check the logs above and DOCS_FERN_TOKEN."
            exit 1
          fi
          # The URL is written to the run summary, so only accept https Fern hosts without userinfo.
          node -e "
            const u = new URL(process.argv[1]);
            const ok = u.protocol === 'https:' && !u.username && !u.password && u.hostname.endsWith('.buildwithfern.com');
            process.exit(ok ? 0 : 1);
          " "$URL" || { echo "::error::Unexpected staging URL host: $URL"; exit 1; }
          echo "Staging URL: $URL"
          echo "🌿 Staging Halos Outside-In docs: $URL" >> "$GITHUB_STEP_SUMMARY"
