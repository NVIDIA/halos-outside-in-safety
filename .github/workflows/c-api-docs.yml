# Keeps the C API reference pages (docs/c-api/) in step with the headers in safety-core/.
#
# - Pull request that changes the headers or this tooling: regenerates the pages and checks that
#   they pass the Fern MDX and link checks. Nothing is committed.
# - Merge to main that changes them: regenerates the pages and, if they changed, opens (or
#   updates) a pull request "docs: regenerate the C API reference" for review. The pages are then
#   published to docs.nvidia.com with the rest of the docs.
#
# Both jobs run on ubuntu-24.04, not ubuntu-latest, because the committed pages were generated
# with its Doxygen 1.9.8. Doxygen 1.15 (Ubuntu 26.04) drops constexpr from variable declarations,
# so on a newer runner every run would report changed pages and open a pull request without any
# header change.
#
# One-time setup by a repository admin: Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests". A pull request opened with the
# default token does not start other workflows; this workflow runs the Fern checks itself before
# opening it.

name: C API Reference

on:
  push:
    branches: [main]
    paths:
      - 'safety-core/**/*.h'
      - 'safety-core/**/*.hpp'
      - 'tools/c-api/**'
      - 'release_metadata.yaml'
      - '.github/workflows/c-api-docs.yml'
  pull_request:
    paths:
      - 'safety-core/**/*.h'
      - 'safety-core/**/*.hpp'
      - 'tools/c-api/**'
      - 'release_metadata.yaml'
      - '.github/workflows/c-api-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: c-api-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check generated pages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - name: Generate the pages
        run: tools/c-api/generate_pages.sh

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Check MDX validity
        run: fern docs md check

      - name: Check broken links
        run: fern docs broken-links --strict

      - name: Report page changes
        run: |
          if git status --porcelain -- docs/c-api | grep -q .; then
            echo "::notice::The C API pages will be regenerated after merge:"
            git status --porcelain -- docs/c-api
          else
            echo "The C API pages are already up to date."
          fi

  update:
    name: Regenerate and open a pull request
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - name: Generate the pages
        run: tools/c-api/generate_pages.sh

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Check MDX validity
        run: fern docs md check

      - name: Check broken links
        run: fern docs broken-links --strict

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          add-paths: docs/c-api
          branch: bot/c-api-reference
          delete-branch: true
          commit-message: 'docs: regenerate the C API reference'
          title: 'docs: regenerate the C API reference'
          body: |
            The headers in `safety-core/` changed on `main`, so `tools/c-api/generate_pages.sh`
            regenerated the C API reference pages in `docs/c-api/`.

            The pages passed `fern docs md check` and `fern docs broken-links --strict` in the
            workflow run that opened this pull request. Review the diff and merge to publish them
            with the docs.
