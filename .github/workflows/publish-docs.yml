# Publishes docs.nvidia.com/halos-outside-in on Halos release tags
# (v1.3.0, v1.2.1) and optional docs-only tags (docs-v1.3.0-1). Runs the
# check-docs workflow first and publishes only if it passes.
# Requires the DOCS_FERN_TOKEN repo secret.

name: publish-docs

on:
  push:
    tags:
      # Engineering release tag, e.g. v1.3.0 or v1.2.1
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      # Doc-only update after a release, e.g. docs-v1.3.0-1
      - 'docs-v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - 'docs-v[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch: {}

permissions:
  contents: read

# Whole runs (checks and publish) are serialized in trigger order. GitHub keeps
# only the newest pending run, so the most recently triggered run publishes
# last. This orders by trigger time, not by version number.
concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  check:
    # Manual runs may only publish from main or a tag; anything else is skipped.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check-docs.yml
    secrets:
      DOCS_FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}

  run:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Create this environment in repo settings and add required reviewers or
    # tag/branch rules to gate production publishes.
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI tool
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Publish Docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: fern generate --docs --log-level debug
