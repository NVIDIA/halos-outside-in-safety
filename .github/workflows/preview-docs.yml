# Publishes a Fern preview of docs.nvidia.com/halos-outside-in for PRs that
# touch docs or fern/, and posts the URL on the PR.
# Requires the DOCS_FERN_TOKEN repo secret.

name: preview-docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/preview-docs.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI tool
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          set -euo pipefail
          OUTPUT=$(fern generate --docs --preview --id "pr-${{ github.event.pull_request.number }}" 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          if [ -z "$URL" ]; then
            echo "::error::Fern did not return a preview URL. Check DOCS_FERN_TOKEN."
            exit 1
          fi
          echo "Preview URL: $URL"
          echo "🌿 Preview Halos Outside-In docs: $URL" > preview_url.txt

      - name: Comment URL in PR
        uses: thollander/actions-comment-pull-request@1d3973dc4b8e1399c0620d3f2b1aa5e795465308 # v2.4.3
        with:
          filePath: preview_url.txt
          comment_tag: fern-docs-preview
