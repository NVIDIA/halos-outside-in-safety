# Validates the Halos Fern docs on PRs and pushes that touch docs or fern/.
# Requires the DOCS_FERN_TOKEN repo secret (from `fern token` for the nvidia
# Fern org). Without it, `fern check` skips the authenticated missing-redirects
# check.

name: check-docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/check-docs.yml'
      - '.github/workflows/preview-docs.yml'
      - '.github/workflows/staging-docs.yml'
      - '.github/workflows/publish-docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/check-docs.yml'
      - '.github/workflows/preview-docs.yml'
      - '.github/workflows/staging-docs.yml'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI tool
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Check MDX safety
        run: |
          BAD=$(grep -rn '<img\b[^>]*[^/]>\|<img>' docs/ fern/ --include="*.md" --include="*.mdx" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Non-self-closing <img> tags found (MDX requires <img ... />):"
            echo "$BAD"
            exit 1
          fi

      - name: Check API is valid
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: fern check

      - name: Check MDX validity
        run: fern docs md check

      - name: Check broken links
        run: fern docs broken-links
