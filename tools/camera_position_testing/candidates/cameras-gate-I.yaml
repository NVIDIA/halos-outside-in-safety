# CANDIDATE camera placement — generated by tools/camera_position_testing/aim_cameras.py
#
# CANDIDATE I: gate line x 9.574, M post spacing y -10.0 / -20.2, z 3.2
#
# Derived from cameras-gate-RECOMMENDED.yaml by moving the cameras listed below and
# aiming each one at a point on the floor. focal_length 8.0 mm is 105.3 deg horizontal FOV.
#
# This file describes poses ONLY. Before it means anything downstream:
#   1. generate_calibration.py --cameras-config <this file> --template <shipped
#      calibration.json>   — otherwise VSS back-projects through the old poses and
#      every world position it reports is wrong while looking healthy.
#   2. screen_fov.py --calibration <that output>   — coverage, before burning a run.
#   3. recreate (not restart) the VSS perception and safety-core containers.

cameras:
  - name: Camera
    camera_prim: /World/Cameras/Camera
    port: 8554
    mount_path: /camera
    # aimed at (7.226, -15.107, 0.000), 6.47 m away, 29.7 deg below horizontal
    spawn:
      position: [9.574000000, -10.000000000, 3.200000000]
      rotation_yxz_deg: [60.346988, 0.000000, 155.308868]
      focal_length: 8.0
      horizontal_aperture: 20.955
      vertical_aperture: 15.2908

  - name: Camera_01
    camera_prim: /World/Cameras/Camera_01
    port: 8555
    mount_path: /camera_01
    # aimed at (7.226, -15.107, 0.000), 6.46 m away, 29.7 deg below horizontal
    spawn:
      position: [9.574000000, -20.200000000, 3.200000000]
      rotation_yxz_deg: [60.291159, 0.000000, 24.750880]
      focal_length: 8.0
      horizontal_aperture: 20.955
      vertical_aperture: 15.2908

